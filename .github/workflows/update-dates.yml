name: Mise à jour automatique des dates (GEO)

on:
  push:
    branches: [main]
    paths:
      - "**.html"

permissions:
  contents: write

jobs:
  update-dates:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code (avec historique pour comparer le commit précédent)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Mettre à jour dateModified + sitemap pour les pages modifiées
        run: python3 scripts/update_dates.py

      - name: Committer les changements (s'il y en a)
        run: |
          git config user.name "3H Conseils GEO Bot"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "Rien à committer."
          else
            git add -A
            git commit -m "Auto: mise à jour dateModified/sitemap [skip ci]"
            git push
          fi
